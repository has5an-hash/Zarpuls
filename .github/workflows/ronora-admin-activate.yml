name: Ronora admin activation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  activate:
    if: startsWith(github.event.issue.title, 'RONORA-ADMIN-ACTIVATE')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Secure WordPress admin activation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem >/dev/null 2>&1
          PUB=$(base64 -w0 /tmp/public.pem)
          gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="RONORA_PUBLIC_KEY=$PUB" >/dev/null
          ENC=''
          for i in $(seq 1 180); do
            BODY=$(gh api "repos/$REPO/issues/$ISSUE" --jq .body)
            ENC=$(printf '%s\n' "$BODY" | sed -n 's/^RONORA_ENC=//p' | head -n1)
            [ -n "$ENC" ] && break
            sleep 5
          done
          [ -n "$ENC" ] || exit 20
          printf '%s' "$ENC" | base64 -d > /tmp/secret.bin
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/secret.bin -out /tmp/secret.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          WP_USER=$(jq -r .wp_user /tmp/secret.json)
          WP_PASS=$(jq -r .wp_pass /tmp/secret.json)
          TOKEN=$(jq -r .token /tmp/secret.json)
          export WP_USER WP_PASS TOKEN
          echo "::add-mask::$WP_USER"
          echo "::add-mask::$WP_PASS"
          echo "::add-mask::$TOKEN"
          python3 -m pip install --quiet selenium

          python3 - <<'PY'
          import os, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.chrome.options import Options

          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=1440,1100')
          d=webdriver.Chrome(options=opt); w=WebDriverWait(d,40)
          try:
              d.get('https://ronora.site.je/wp-login.php')
              w.until(EC.presence_of_element_located((By.ID,'user_login'))).send_keys(os.environ['WP_USER'])
              d.find_element(By.ID,'user_pass').send_keys(os.environ['WP_PASS'])
              d.find_element(By.ID,'wp-submit').click()
              w.until(lambda x: '/wp-admin/' in x.current_url)
              print('WP_LOGIN_OK')

              d.get('https://ronora.site.je/wp-admin/theme-editor.php?file=functions.php')
              w.until(EC.presence_of_element_located((By.ID,'newcontent')))
              ta=d.find_element(By.ID,'newcontent')
              src=ta.get_attribute('value') or ta.text
              token=os.environ['TOKEN']
              marker='RONORA_ONE_TIME_ACTIVATOR_V1'
              if marker not in src:
                  snippet=f'''\n/* {marker} */\nadd_action('init', function() {{\n    if (!is_user_logged_in() || !current_user_can('manage_options')) return;\n    if (!isset($_GET['ronora_activate']) || !hash_equals('{token}', (string) $_GET['ronora_activate'])) return;\n    ob_start(); require ABSPATH . 'ronora-bootstrap.php'; ob_end_clean();\n    if (!function_exists('rr_install_embedded_theme')) wp_die('Ronora bootstrap functions missing');\n    rr_install_embedded_theme();\n    update_option('ronora_demo_seeded', false);\n    update_option('blogname', 'رونورا | سالن زیبایی');\n    update_option('blogdescription', 'رزرو آنلاین خدمات زیبایی، مراقبت و استایل');\n    update_option('timezone_string', 'Asia/Tehran');\n    wp_die('RONORA_ACTIVATED_OK');\n}});\n'''
                  d.execute_script("arguments[0].value = arguments[1]; arguments[0].dispatchEvent(new Event('change',{bubbles:true}));", ta, src+snippet)
                  d.find_element(By.ID,'submit').click()
                  w.until(lambda x: 'notice-success' in x.page_source or 'موفقیت' in x.page_source or 'success' in x.page_source.lower())
                  print('THEME_EDITOR_PATCH_OK')

              d.get('https://ronora.site.je/?ronora_activate='+token)
              time.sleep(7)
              if 'RONORA_ACTIVATED_OK' not in d.page_source:
                  print('ACTIVATE_TITLE='+d.title); print(d.page_source[:2200]); raise RuntimeError('activation marker missing')
              print('RONORA_SWITCH_OK')

              d.get('https://ronora.site.je/')
              time.sleep(12)
              html=d.page_source
              if 'رونورا' not in html and 'RONORA' not in html.upper(): raise RuntimeError('homepage Ronora marker missing')
              print('RONORA_HOME_OK title='+d.title)
          finally:
              d.quit()
          PY
          gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body='RONORA_ADMIN_ACTIVATION_OK' >/dev/null
