name: Ronora browser check

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  check:
    if: startsWith(github.event.issue.title, 'RONORA-BROWSER-CHECK')
    runs-on: ubuntu-latest
    steps:
      - name: Check with real headless Chrome
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body='RONORA_BROWSER_RESULT=no_chrome' >/dev/null
            exit 1
          fi
          rm -rf /tmp/ronora-chrome
          report="chrome=$CHROME"
          for path in / /wp-login.php /ronora-postinstall.php /ronora-bootstrap.php; do
            out="/tmp/dom-$(echo "$path" | tr '/.' '__').html"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/ronora-chrome --virtual-time-budget=9000 --dump-dom "https://ronora.site.je$path" > "$out" 2>/tmp/chrome.err || true
            title=$(grep -oPm1 '(?<=<title>)[^<]+' "$out" || true)
            marker=$(grep -Eo 'نصب مرحله دوم رونورا|سازنده دمو رونورا|WordPress|RONORA|رونورا|404|Not Found' "$out" | head -n1 || true)
            bytes=$(wc -c < "$out" | tr -d ' ')
            sha=$(sha256sum "$out" | awk '{print $1}' | cut -c1-12)
            report="$report\n$path bytes=$bytes sha=$sha title=${title:-none} marker=${marker:-none}"
          done
          gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="RONORA_BROWSER_RESULT=$report" >/dev/null
