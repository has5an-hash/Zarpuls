name: Ronora live status

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  status:
    if: startsWith(github.event.issue.title, 'RONORA-LIVE-STATUS')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secure live status check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem >/dev/null 2>&1
          PUB=$(base64 -w0 /tmp/public.pem)
          gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="RONORA_PUBLIC_KEY=$PUB" >/dev/null
          ENC=''
          for i in $(seq 1 120); do
            BODY=$(gh api "repos/$REPO/issues/$ISSUE" --jq .body)
            ENC=$(printf '%s\n' "$BODY" | sed -n 's/^RONORA_ENC=//p' | head -n1)
            [ -n "$ENC" ] && break
            sleep 5
          done
          [ -n "$ENC" ] || { echo 'No encrypted payload'; exit 20; }
          printf '%s' "$ENC" | base64 -d > /tmp/secret.bin
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/secret.bin -out /tmp/secret.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          FTP_USER=$(jq -r .ftp_user /tmp/secret.json)
          FTP_PASS=$(jq -r .ftp_pass /tmp/secret.json)
          FTP_HOST=$(jq -r '.ftp_host // "ftpupload.net"' /tmp/secret.json)
          TOKEN=$(jq -r .token /tmp/secret.json)
          export FTP_USER FTP_PASS FTP_HOST TOKEN
          echo "::add-mask::$FTP_USER"
          echo "::add-mask::$FTP_PASS"
          echo "::add-mask::$TOKEN"

          python3 - <<'PY'
          import ftplib, os
          from io import BytesIO
          token=os.environ['TOKEN']
          php=f'''<?php
          header('Content-Type: application/json; charset=utf-8');
          if (!isset($_GET['token']) || !hash_equals('{token}', (string) $_GET['token'])) {{ http_response_code(403); echo json_encode(['ok'=>false]); exit; }}
          define('WP_USE_THEMES', false);
          require __DIR__ . '/wp-load.php';
          $types=['post','page','ronora_service','ronora_specialist','ronora_portfolio','ronora_appointment','ronora_review','ronora_package','ronora_smslog'];
          $counts=[];
          foreach($types as $t) {{ $o=wp_count_posts($t); $counts[$t]=isset($o->publish)?(int)$o->publish:0; }}
          $theme=wp_get_theme();
          $front=(int)get_option('page_on_front');
          $data=[
            'ok'=>true,
            'wp'=>get_bloginfo('version'),
            'php'=>PHP_VERSION,
            'name'=>get_bloginfo('name'),
            'description'=>get_bloginfo('description'),
            'home'=>home_url('/'),
            'stylesheet'=>get_option('stylesheet'),
            'template'=>get_option('template'),
            'theme_name'=>$theme->get('Name'),
            'theme_version'=>$theme->get('Version'),
            'theme_author'=>wp_strip_all_tags($theme->get('Author')),
            'locale'=>get_locale(),
            'timezone'=>wp_timezone_string(),
            'front_id'=>$front,
            'front_title'=>$front?get_the_title($front):'',
            'seeded'=>get_option('ronora_demo_seeded',null),
            'counts'=>$counts,
            'permalink'=>get_option('permalink_structure'),
          ];
          echo wp_json_encode($data, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          '''
          ftp=ftplib.FTP(os.environ['FTP_HOST'], timeout=40)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASS']); ftp.set_pasv(True)
          try: ftp.cwd('/htdocs')
          except Exception: ftp.cwd('htdocs')
          ftp.storbinary('STOR ronora-live-status.php', BytesIO(php.encode()))
          ftp.quit()
          PY

          CHROME=$(command -v google-chrome || command -v chromium || true)
          [ -n "$CHROME" ] || exit 21
          rm -rf /tmp/chrome
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/chrome --virtual-time-budget=8000 --dump-dom "https://ronora.site.je/ronora-live-status.php?token=$TOKEN" > /tmp/status.html 2>/tmp/chrome.err || true
          python3 - <<'PY'
          import re, html, json
          s=open('/tmp/status.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'<body[^>]*>(.*?)</body>',s,re.S|re.I)
          body=html.unescape(re.sub('<[^>]+>','',m.group(1) if m else s)).strip()
          try:
            obj=json.loads(body)
          except Exception:
            print('BODY',body[:3000]); raise
          open('/tmp/status.json','w',encoding='utf-8').write(json.dumps(obj,ensure_ascii=False))
          print(json.dumps(obj,ensure_ascii=False))
          PY

          python3 - <<'PY'
          import ftplib, os
          ftp=ftplib.FTP(os.environ['FTP_HOST'], timeout=40)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASS']); ftp.set_pasv(True)
          try: ftp.cwd('/htdocs')
          except Exception: ftp.cwd('htdocs')
          for f in ['ronora-live-status.php','ronora-activate.php']:
            try: ftp.delete(f)
            except Exception: pass
          ftp.quit()
          PY
          STATUS=$(cat /tmp/status.json)
          gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="RONORA_STATUS=$STATUS" >/dev/null
