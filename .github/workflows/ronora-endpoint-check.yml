name: Ronora endpoint check

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  check:
    if: startsWith(github.event.issue.title, 'RONORA-CHECK')
    runs-on: ubuntu-latest
    steps:
      - name: Check public endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -u
          report=''
          for path in / /wp-login.php /wp-json/ /ronora-postinstall.php /ronora-bootstrap.php; do
            code=$(curl -sS -L -A 'Mozilla/5.0 RonoraQA/1.0' --max-time 30 -o /tmp/body -w '%{http_code}' "https://ronora.site.je$path" || true)
            marker=$(head -c 1200 /tmp/body 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | grep -Eo 'نصب مرحله دوم رونورا|سازنده دمو رونورا|WordPress|RONORA|رونورا' | head -n1 || true)
            report="$report\n$path => HTTP $code marker=${marker:-none}"
          done
          gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="RONORA_CHECK_RESULT=$report" >/dev/null
