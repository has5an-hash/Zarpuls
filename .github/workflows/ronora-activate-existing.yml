name: Ronora activate existing bootstrap

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  activate:
    if: startsWith(github.event.issue.title, 'RONORA-ACTIVATE')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create ephemeral secure channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem >/dev/null 2>&1
          PUB=$(base64 -w0 /tmp/public.pem)
          gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="RONORA_PUBLIC_KEY=$PUB" >/dev/null
          echo 'Secure channel ready.'

          ENC=''
          for i in $(seq 1 180); do
            BODY=$(gh api "repos/$REPO/issues/$ISSUE" --jq .body)
            ENC=$(printf '%s\n' "$BODY" | sed -n 's/^RONORA_ENC=//p' | head -n1)
            [ -n "$ENC" ] && break
            sleep 5
          done
          [ -n "$ENC" ] || { echo 'No encrypted payload received.'; exit 20; }
          printf '%s' "$ENC" | base64 -d > /tmp/secret.bin
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/secret.bin -out /tmp/secret.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256

          FTP_USER=$(jq -r .ftp_user /tmp/secret.json)
          FTP_PASS=$(jq -r .ftp_pass /tmp/secret.json)
          FTP_HOST=$(jq -r '.ftp_host // "ftpupload.net"' /tmp/secret.json)
          TOKEN=$(jq -r .token /tmp/secret.json)
          export FTP_USER FTP_PASS FTP_HOST TOKEN
          echo "::add-mask::$FTP_USER"
          echo "::add-mask::$FTP_PASS"
          echo "::add-mask::$TOKEN"

          python3 - <<'PY'
          import ftplib, os
          token=os.environ['TOKEN']
          php=f'''<?php
          header('Content-Type: application/json; charset=utf-8');
          if (!isset($_GET['token']) || !hash_equals('{token}', (string)$_GET['token'])) {{ http_response_code(403); echo json_encode(['ok'=>false]); exit; }}
          try {{
              ob_start(); require __DIR__ . '/ronora-bootstrap.php'; ob_end_clean();
              if (!function_exists('rr_install_embedded_theme')) throw new RuntimeException('bootstrap functions missing');
              rr_install_embedded_theme();
              rr_load_wp();
              update_option('ronora_demo_seeded', false);
              update_option('blogname', 'رونورا | سالن زیبایی');
              update_option('blogdescription', 'رزرو آنلاین خدمات زیبایی، مراقبت و استایل');
              update_option('timezone_string', 'Asia/Tehran');
              echo json_encode(['ok'=>true,'theme'=>get_option('stylesheet'),'home'=>home_url('/')], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          }} catch (Throwable $e) {{ http_response_code(500); echo json_encode(['ok'=>false,'error'=>$e->getMessage()], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES); }}
          '''
          ftp=ftplib.FTP(os.environ['FTP_HOST'], timeout=40)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASS'])
          ftp.set_pasv(True)
          try: ftp.cwd('/htdocs')
          except Exception: ftp.cwd('htdocs')
          from io import BytesIO
          ftp.storbinary('STOR ronora-activate.php', BytesIO(php.encode('utf-8')))
          ftp.quit()
          print('Activator uploaded by FTP.')
          PY

          CHROME=$(command -v google-chrome || command -v chromium || true)
          [ -n "$CHROME" ] || { echo 'Chrome unavailable'; exit 21; }
          rm -rf /tmp/chrome
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/chrome --virtual-time-budget=10000 --dump-dom "https://ronora.site.je/ronora-activate.php?token=$TOKEN" > /tmp/activate.html 2>/tmp/chrome.err || true
          grep -q '"ok":true' /tmp/activate.html || { echo 'Activation marker not found'; head -c 2000 /tmp/activate.html; exit 22; }

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/chrome --virtual-time-budget=12000 --dump-dom 'https://ronora.site.je/' > /tmp/home.html 2>/tmp/chrome2.err || true
          TITLE=$(grep -oPm1 '(?<=<title>)[^<]+' /tmp/home.html || true)
          grep -qi 'رونورا\|RONORA' /tmp/home.html || { echo 'Ronora homepage marker not found'; exit 23; }

          python3 - <<'PY'
          import ftplib, os
          ftp=ftplib.FTP(os.environ['FTP_HOST'], timeout=40)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASS'])
          ftp.set_pasv(True)
          try: ftp.cwd('/htdocs')
          except Exception: ftp.cwd('htdocs')
          try: ftp.delete('ronora-activate.php')
          except Exception as e: print('cleanup warning', e)
          ftp.quit()
          PY
          gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="RONORA_ACTIVATION_OK title=$TITLE" >/dev/null
